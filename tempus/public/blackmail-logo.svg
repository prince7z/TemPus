<svg width="40" height="40" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .logo-fill { fill: currentColor; }
      .logo-stroke { stroke: currentColor; stroke-width: 2; fill: none; }
      .logo-white { fill: white; }
    </style>
  </defs>
  
  <!-- Main shield shape -->
  <path class="logo-fill" d="M20 15 L80 15 L85 25 L85 70 C85 80 75 90 50 90 C25 90 15 80 15 70 L15 25 Z" />
  
  <!-- Cat ears -->
  <path class="logo-fill" d="M30 15 L35 5 L45 15 Z" />
  <path class="logo-fill" d="M55 15 L65 5 L70 15 Z" />
  
  <!-- Cat eyes -->
  <ellipse class="logo-white" cx="35" cy="35" rx="4" ry="6" />
  <ellipse class="logo-white" cx="65" cy="35" rx="4" ry="6" />
  
  <!-- Cat nose/mouth area - stylized "E" shapes -->
  <g class="logo-white">
    <!-- Left "E" -->
    <path stroke="white" stroke-width="2" fill="none" d="M25 50 L35 50 M25 50 L25 60 M25 55 L32 55 M25 60 L35 60" />
    
    <!-- Right "E" (mirrored) -->
    <path stroke="white" stroke-width="2" fill="none" d="M75 50 L65 50 M75 50 L75 60 M75 55 L68 55 M75 60 L65 60" />
  </g>
  
  <!-- Bottom point of shield -->
  <path class="logo-fill" d="M40 80 L50 90 L60 80" />
</svg>